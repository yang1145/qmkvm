# www 官网静态托管（SSG 产物 out/）
# 语言协商已内置于产物（根路径 index.html 内联脚本），此处无需任何服务端跳转配置
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # 未命中路径回退到根级 404.html（各 pages 平台同样按此约定自动生效）
    error_page 404 /404.html;

    # Next.js 带内容哈希的静态资源：永久缓存
    location /_next/static/ {
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # 图片/字体：30 天
    location ~* \.(webp|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    location = /healthz {
        return 200 "ok";
    }
}
