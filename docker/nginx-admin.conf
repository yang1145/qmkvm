server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA 回退（admin 构建时经 ADMIN_API_URL 注入 API 绝对地址，跨域直连 api，
    # 无需 /api 反代；需 CORS_ORIGINS 收录 admin 域名）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源长缓存（umi 产物带 hash）
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /healthz {
        return 200 "ok";
    }
}
