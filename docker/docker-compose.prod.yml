# 生产部署编排：docker compose -f docker/docker-compose.prod.yml --env-file .env up -d
# （--env-file 必须显式指定：compose v2 用 -f 时，插值 .env 从编排文件所在目录查找
#  而非仓库根，DOMAIN_BASE/ACME_EMAIL/ADMIN_API_URL/MYSQL_ROOT_PASSWORD 等 :? 必填项会误报缺失）
# 前置：仓库根 .env 已配置（DOMAIN_BASE、ACME_EMAIL、DATABASE_URL 指向可写 MySQL、
#       REDIS_URL、APP_KEY、CORS_ORIGINS 等）
# 首次部署：先执行迁移与种子（见 README 部署方案）
# 公网入口：内置 gateway 容器托管域名（80→443 + Let's Encrypt 免费证书自动签发续期，
#           域名经 DOMAIN_BASE 推导）；需 DNS A 记录指向本机、80/443 公网可达
name: qmkvm

services:
  # 公网 HTTPS 入口：按 .env 域名生成 server 块，ACME HTTP-01 自动签发/续期
  gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile.gateway
    restart: unless-stopped
    env_file: ../.env
    environment:
      GATEWAY_WWW_DOMAIN: "www.${DOMAIN_BASE:?请在 .env 设置 DOMAIN_BASE（如 example.com）}"
      GATEWAY_PORTAL_DOMAIN: "portal.${DOMAIN_BASE:?}"
      GATEWAY_ADMIN_DOMAIN: "admin.${DOMAIN_BASE:?}"
      GATEWAY_API_DOMAIN: "api.${DOMAIN_BASE:?}"
      ACME_EMAIL: ${ACME_EMAIL:?请在 .env 设置 ACME_EMAIL（证书注册邮箱）}
    depends_on:
      - api
      - portal
      - www
      - admin
    ports:
      - "80:80"     # ACME HTTP-01 验证 + 80→443 跳转，必须公网可达
      - "443:443"
    volumes:
      - gateway-ssl:/etc/nginx/ssl
      - gateway-acme:/var/lib/acme

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 或环境设置}
      MYSQL_DATABASE: qmkvm
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    # 建议不暴露公网端口；如需外访走 SSH 隧道

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # BullMQ 依赖持久化 key，必须 noeviction
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    volumes:
      - redis-data:/data

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.node
      args: { APP: api }
    restart: unless-stopped
    env_file: ../.env
    environment:
      API_PORT: "4000"
      NODE_ENV: production
      DEV_MOCK_PAYMENTS: "false"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    # 仅在内网暴露；公网经宿主机反向代理
    ports:
      - "127.0.0.1:4000:4000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.node
      args: { APP: worker }
    restart: unless-stopped
    env_file: ../.env
    environment:
      NODE_ENV: production
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  # portal 客户中心：SPA/静态导出，nginx 托管 out/；NEXT_PUBLIC_API_URL 构建期烘焙，改动需重建
  portal:
    build:
      context: ..
      dockerfile: docker/Dockerfile.next
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:80"

  # www 官网：SSG 静态导出，nginx 托管 out/；NEXT_PUBLIC_* 为构建期烘焙，改动需重建
  www:
    build:
      context: ..
      dockerfile: docker/Dockerfile.www
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
        NEXT_PUBLIC_PORTAL_URL: ${NEXT_PUBLIC_PORTAL_URL:-}
        NEXT_PUBLIC_BRAND_NAME: ${NEXT_PUBLIC_BRAND_NAME:-}
        NEXT_PUBLIC_BRAND_NAME_EN: ${NEXT_PUBLIC_BRAND_NAME_EN:-}
        # 品牌定制拉取端点（admin「站点信息」→ GET /api/v1/public/settings），构建期烘焙
        BRANDING_API_URL: ${BRANDING_API_URL:-}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"

  admin:
    build:
      context: ..
      dockerfile: docker/Dockerfile.admin
      args:
        # admin 统一走构建期注入的 API 绝对地址直连（跨域），不使用反代；
        # 需将 admin 域名加入 CORS_ORIGINS
        ADMIN_API_URL: ${ADMIN_API_URL:?请在 .env 设置 ADMIN_API_URL（如 https://api.example.com）}
    restart: unless-stopped
    ports:
      # 管理后台建议只走反代 + IP 白名单 / VPN
      - "127.0.0.1:8000:80"

volumes:
  mysql-data:
  redis-data:
  gateway-ssl:
  gateway-acme:
