# portal 客户中心静态托管（SPA/静态导出产物 out/）
# 路由均为预渲染 HTML（详情页取查询参数 ?id=，不影响路径命中），无需 SPA 回退
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # 未命中路径回退到根级 404.html
    error_page 404 /404.html;

    # Next.js 带内容哈希的静态资源：永久缓存
    location /_next/static/ {
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # 图片/字体：30 天
    location ~* \.(webp|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    location = /healthz {
        return 200 "ok";
    }
}
