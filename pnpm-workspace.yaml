packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  '@alicloud/openapi-core': true
  '@parcel/watcher': true
  '@swc/core': true
  core-js: true
  core-js-pure: true
  es5-ext: true
  esbuild: true
  msgpackr-extract: true
  unrs-resolver: true

onlyBuiltDependencies:
  - esbuild
  - "@swc/core"
  - "@parcel/watcher"
  - "msgpackr-extract"
  - "unrs-resolver"
  - sharp
